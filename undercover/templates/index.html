<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undercover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-min-players="{{ min_players }}">
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fas fa-user-secret"></i> Undercover</h1>
        </header>

        <!-- Écran 1 — configuration de la partie -->
        <section id="setup-screen" class="app-screen">
            <div class="app-card">
                <div class="app-card-header"><i class="fas fa-cog"></i> Configuration</div>
                <div class="app-card-body">
                    <div class="form-group">
                        <label class="app-label" for="num-players">
                            <i class="fas fa-users"></i> Nombre de joueurs
                        </label>
                        <div class="number-input">
                            <button type="button" class="btn-number" data-step="-1" data-target="num-players">−</button>
                            <input type="number" class="form-control" id="num-players" value="4" readonly>
                            <button type="button" class="btn-number" data-step="1" data-target="num-players">+</button>
                        </div>
                    </div>

                    <div class="roles-setup">
                        <h2 class="section-title"><i class="fas fa-user-secret"></i> Rôles spéciaux</h2>

                        <div class="form-group">
                            <label class="app-label" for="num-undercover">
                                <i class="fas fa-mask"></i> Undercover
                            </label>
                            <div class="number-input">
                                <button type="button" class="btn-number" data-step="-1" data-target="num-undercover">−</button>
                                <input type="number" class="form-control" id="num-undercover" value="1" readonly>
                                <button type="button" class="btn-number" data-step="1" data-target="num-undercover">+</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="app-label" for="num-mr-white">
                                <i class="fas fa-hat-wizard"></i> Mr. White
                            </label>
                            <div class="number-input">
                                <button type="button" class="btn-number" data-step="-1" data-target="num-mr-white">−</button>
                                <input type="number" class="form-control" id="num-mr-white" value="0" readonly>
                                <button type="button" class="btn-number" data-step="1" data-target="num-mr-white">+</button>
                            </div>
                        </div>

                        <p id="roles-hint" class="hint"></p>
                    </div>

                    <div class="roles-info">
                        <div class="info-card civilian">
                            <i class="fas fa-user"></i>
                            <span>Civil</span>
                            <small>Connaît le mot de la majorité</small>
                        </div>
                        <div class="info-card undercover">
                            <i class="fas fa-mask"></i>
                            <span>Undercover</span>
                            <small>Connaît un mot voisin</small>
                        </div>
                        <div class="info-card mr-white">
                            <i class="fas fa-hat-wizard"></i>
                            <span>Mr. White</span>
                            <small>N'a aucun mot</small>
                        </div>
                    </div>

                    <div id="player-names" class="player-names-container"></div>

                    <button id="start-game" class="app-button">
                        <i class="fas fa-play"></i> Commencer la partie
                    </button>
                </div>
            </div>
        </section>

        <!-- Écran 2 — chacun découvre son mot -->
        <section id="reveal-screen" class="app-screen" hidden>
            <div class="app-card">
                <div class="app-card-header"><i class="fas fa-eye"></i> Distribution des mots</div>
                <div class="app-card-body">
                    <p class="turn-label">
                        Passez l'appareil à <strong id="current-player"></strong>
                    </p>

                    <div id="word-card" class="word-card" hidden>
                        <div id="word-content" class="word-content"></div>
                        <p id="word-hint" class="hint"></p>
                    </div>

                    <div class="player-actions">
                        <button id="show-word" class="app-button">
                            <i class="fas fa-eye"></i> Voir mon mot
                        </button>
                        <button id="next-player" class="app-button" hidden>
                            <i class="fas fa-arrow-right"></i> <span id="next-label">Suivant</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Écran 3 — débat et éliminations -->
        <section id="game-screen" class="app-screen" hidden>
            <div id="winner-banner" class="winner-banner" hidden></div>

            <div class="app-card" id="active-card">
                <div class="app-card-header"><i class="fas fa-users"></i> Encore en jeu</div>
                <div class="app-card-body">
                    <p class="hint">Débattez à voix haute, puis éliminez un joueur.</p>
                    <div id="active-list" class="player-list"></div>
                </div>
            </div>

            <div class="app-card" id="eliminated-card" hidden>
                <div class="app-card-header"><i class="fas fa-user-slash"></i> Éliminés</div>
                <div class="app-card-body">
                    <div id="eliminated-list" class="player-list"></div>
                </div>
            </div>

            <div class="app-card" id="reveal-card" hidden>
                <div class="app-card-header"><i class="fas fa-scroll"></i> Révélation</div>
                <div class="app-card-body">
                    <div id="reveal-list" class="word-list"></div>
                </div>
            </div>

            <button id="new-game" class="app-button danger-button">
                <i class="fas fa-redo"></i> Nouvelle partie
            </button>
        </section>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
